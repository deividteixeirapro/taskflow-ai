<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow AI - Gerenciador de Tarefas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 10px 20px; background-color: #2ea44f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2c974b; }
        ul { list-style: none; padding: 0; }
        li { background: #fafafa; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background-color: #d73a49; padding: 5px 10px; font-size: 14px; }
        .delete-btn:hover { background-color: #cb2431; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TaskFlow AI 🚀</h1>
        
        <div class="form-group">
            <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
            <button onclick="addTask()">Adicionar</button>
        </div>

        <ul id="taskList">
            <!-- As tarefas aparecem aqui -->
        </ul>
    </div>

    <script>
        const tasks = [
            { id: 1, title: 'Criar repositório no GitHub', status: 'concluido' },
            { id: 2, title: 'Estudar lógica de programação', status: 'fazendo' },
            { id: 3, title: 'Configurar ambiente de ADS', status: 'fazer' }
        ];

        function renderTasks() {
            const listElement = document.getElementById('taskList');
            listElement.innerHTML = '';
            
            tasks.forEach(task => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${task.title}</span>
                    <button class="delete-btn" onclick="removeTask(${task.id})">Excluir</button>
                `;
                listElement.appendChild(li);
            });
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim() === '') return;

            const newTask = {
                id: tasks.length + 1,
                title: input.value,
                status: 'fazer'
            };

            tasks.push(newTask);
            input.value = '';
            renderTasks();
        }

        function removeTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            if (index !== -1) {
                tasks.splice(index, 1);
                renderTasks();
            }
        }

        renderTasks();
    </script>
</body>
</html>
